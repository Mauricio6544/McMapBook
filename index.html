<!doctype html>
<html lang="pt-BR" data-theme="dark" style="color-scheme: dark;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MC Map Book</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#efe9d8;--fg:#23201a;--card:#fffdf6;--bd:#cfc6ad;--ac:#3f8f2f;--ac2:#2c6bd6;--mut:#6b6455;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150f;--fg:#efe9d8;--card:#241f16;--bd:#3d3626;--ac:#5cb84a;--ac2:#7aa5f5;--mut:#a39a84;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17150f;--fg:#efe9d8;--card:#241f16;--bd:#3d3626;--ac:#5cb84a;--ac2:#7aa5f5;--mut:#a39a84;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
h1,h2,.btn{font-family:"Press Start 2P",ui-monospace,monospace}
main{max-width:960px;margin:0 auto;padding:24px 16px}
.hero{text-align:center;padding:48px 0 24px}
.hero h1{font-size:clamp(20px,5vw,34px);line-height:1.4;margin:0 0 16px}
.hero p{color:var(--mut);max-width:520px;margin:0 auto 32px}
.choose{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;border:3px solid var(--fg);background:var(--ac);color:#fff;padding:16px 20px;font-size:12px;text-decoration:none;cursor:pointer;box-shadow:4px 4px 0 var(--fg)}
.btn.b{background:var(--ac2)}.btn.s{font-size:10px;padding:10px 12px;box-shadow:3px 3px 0 var(--fg)}
.btn.g{background:var(--card);color:var(--fg)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h2{font-size:16px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:2px solid var(--bd);display:flex;flex-direction:column}
.img{aspect-ratio:16/9;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-size:40px}
.img img{width:100%;height:100%;object-fit:cover}
.body{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{margin:0;font-size:17px}.body p{margin:0;color:var(--mut);flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-weight:700}
.admin{margin-top:40px;border:2px dashed var(--bd);padding:16px;overflow-x:auto}
.admin form{display:grid;gap:10px;margin-top:12px}
input,select,textarea{font:inherit;padding:8px;border:2px solid var(--bd);background:var(--card);color:var(--fg);max-width:100%}
.mut{color:var(--mut)}.msg{margin-top:8px;color:var(--ac2)}
</style></head>
<body><main id="app"></main>
<script id="state" type="application/json">{"brand":"MC Map Book","tagline":"Aventuras, cidades e desafios feitos à mão para o seu mundo de Minecraft.","maps":[{"id":"ex1","ed":"java","name":"Mapa de exemplo (Java)","price":"R$ 10","desc":"Troque este mapa de exemplo pelos seus no painel abaixo.","link":"","img":""},{"id":"mvushlmw","ed":"bedrock","name":"Parque De Diversões CMG Beta","price":"R$6","desc":"Um mapa em desenvolvimento","link":"https://mauricio6544.itch.io/cmg-mapa","img":"/_blob/3ed1047363f047baebe9984802d30d82"}]}</script>
<script>
const $=s=>document.querySelector(s);
let S=JSON.parse($('#state').textContent),canEdit=false,artifact=null,assets=null;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const view=()=>{const h=location.hash.slice(1);return h==='java'||h==='bedrock'?h:'home'};
async function save(){
  if(!artifact){$('#msg').textContent='Salvar não está disponível nesta visualização.';return}
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML='';
  c.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
  try{await artifact.publish('<!doctype html>\n'+c.outerHTML)}
  catch(e){$('#msg').textContent='Não foi possível salvar: '+(e.code||e.message)}
}
function card(m){
  const buy=/^https?:\/\//.test(m.link)?'<a class="btn s" target="_blank" rel="noopener" href="'+esc(m.link)+'">Comprar</a>':'<span class="mut">Em breve</span>';
  return '<div class="card"><div class="img">'+(m.img?'<img alt="" src="'+esc(m.img)+'">':'⛏️')+'</div><div class="body"><h3>'+esc(m.name)+'</h3><p>'+esc(m.desc)+'</p><div class="row"><span class="price">'+esc(m.price)+'</span>'+buy+'</div>'+(canEdit?'<button class="btn s g" data-del="'+esc(m.id)+'">Remover</button>':'')+'</div></div>';
}
function render(){
  const v=view();let h='';
  if(v==='home'){
    h='<section class="hero"><h1>'+esc(S.brand)+'</h1><p>'+esc(S.tagline)+'</p><div class="choose"><a class="btn" href="#java">Mapas Java</a><a class="btn b" href="#bedrock">Mapas Bedrock</a></div></section>';
  }else{
    const list=S.maps.filter(m=>m.ed===v);
    h='<div class="top"><h2>Mapas '+(v==='java'?'Java':'Bedrock')+'</h2><a class="btn s g" href="#home">← Início</a></div>'+(list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<p class="mut">Ainda não há mapas aqui. Volte em breve!</p>');
  }
  if(canEdit){
    h+='<section class="admin"><h2>Painel do editor</h2><form id="f"><input name="name" placeholder="Nome do mapa" required><select name="ed"><option value="java">Java</option><option value="bedrock">Bedrock</option></select><input name="price" placeholder="Preço (ex.: R$ 15)" required><textarea name="desc" rows="3" placeholder="Descrição"></textarea><input name="link" type="url" placeholder="Link de compra (https://...)">'+(assets?'<label class="mut">Imagem (opcional)<br><input name="file" type="file" accept="image/*"></label>':'')+'<button class="btn s" type="submit">Adicionar mapa</button></form><div class="msg" id="msg"></div></section>';
  }
  $('#app').innerHTML=h;
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.maps=S.maps.filter(m=>m.id!==b.dataset.del);save()});
  const f=$('#f');
  if(f)f.onsubmit=async e=>{
    e.preventDefault();const d=new FormData(f);let img='';
    const file=d.get('file');
    if(assets&&file&&file.size){try{img=(await assets.upload(file)).url}catch(x){$('#msg').textContent='Falha ao enviar a imagem.';return}}
    S.maps.push({id:Date.now().toString(36),ed:d.get('ed'),name:d.get('name'),price:d.get('price'),desc:d.get('desc'),link:d.get('link'),img});
    save();
  };
}
render();addEventListener('hashchange',render);
(async()=>{
  try{
    if(!window.claude)return;
    const u=await claude.use('user');canEdit=!!(u&&u.canEdit());
    if(canEdit){artifact=await claude.use('artifact');assets=await claude.use('assets')}
  }catch(e){}
  render();
})();
</script>
</body></html>
